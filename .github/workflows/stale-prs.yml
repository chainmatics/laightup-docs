name: Close stale PRs

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-pr-stale: 30
          days-before-pr-close: 7
          days-before-issue-stale: -1
          days-before-issue-close: -1
          stale-pr-label: stale
          exempt-pr-labels: keep-open,dependencies
          stale-pr-message: 'This PR has had no activity for 30 days and will be closed in 7 days. Add a comment or commit, or label it `keep-open`, to keep it open.'
          close-pr-message: 'Closed after 37 days without activity. Reopen it if it is still needed.'
          delete-branch: false
